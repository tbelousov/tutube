services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutube-app
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    networks:
      - tutube-network

networks:
  tutube-network:
    driver: bridge