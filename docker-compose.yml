services:
  postgres:
    image: postgres:17.5
    container_name: tutube-postgres
    restart: always
    environment:
      POSTGRES_DB: tutube
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tutube-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutube-app
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tutube
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tutube-network

volumes:
  pgdata:
    driver: local

networks:
  tutube-network:
    driver: bridge